<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa Romántico de Colombia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin:0; padding:0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Inicializar mapa centrado en Colombia
    var map = L.map('map').setView([4.5, -75.8], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Leer puntos desde puntos.json
    fetch("puntos.json")
      .then(res => res.json())
      .then(puntos => {
        puntos.forEach(p => {
          const [lat, lng] = p.coords.split(",").map(Number);
          L.marker([lat, lng]).addTo(map)
            .bindPopup("📍 " + p.nombre);
        });
      })
      .catch(err => console.error("Error cargando puntos.json:", err));

    // Leer departamentos desde colombia.geo.json y Departamentos.json
    Promise.all([
      fetch("colombia.geo.json").then(res => res.json()),
      fetch("Departamentos.json").then(res => res.json())
    ]).then(([geoData, depData]) => {
      L.geoJSON(geoData, {
        style: function(feature) {
          if (depData.destacados.includes(feature.properties.DPTO_CNMBR)) {
            return {
              color: "red",
              weight: 2,
              fillColor: "red",
              fillOpacity: 0.5
            };
          }
          return {
            color: "gray",
            weight: 1,
            fillColor: "lightgray",
            fillOpacity: 0.1
          };
        },
        onEachFeature: function(feature, layer) {
          layer.bindPopup("Departamento: " + feature.properties.DPTO_CNMBR);
        }
      }).addTo(map);
    }).catch(err => console.error("Error cargando departamentos:", err));
  </script>
</body>
</html>
