<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa Romántico de Colombia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin:0; padding:0; }
    #map { height: 90vh; width: 100%; }
    #controls { padding: 10px; text-align: center; }
    button { padding: 8px 12px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="nuevoPunto()">➕ Nuevo punto (solo prueba)</button>
  </div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Inicializar mapa centrado en Colombia
    var map = L.map('map').setView([4.5, -75.8], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Leer puntos desde puntos.json
    fetch("puntos.json")
      .then(res => res.json())
      .then(puntos => {
        puntos.forEach(p => {
          const [lat, lng] = p.coords.split(",").map(Number);
          L.marker([lat, lng]).addTo(map)
            .bindPopup("📍 " + p.nombre);
        });
      })
      .catch(err => console.error("Error cargando puntos.json:", err));

    // Botón para probar un nuevo punto (no guarda en el JSON)
    function nuevoPunto() {
      const coords = prompt("Ingresa coordenadas (lat, lng):");
      const nombre = prompt("Ingresa nombre o etiqueta:");
      if (!coords || !nombre) return;

      // Solo dibuja en el mapa y muestra en consola
      console.log("Nuevo punto (manual):", { coords, nombre });

      const [lat, lng] = coords.split(",").map(Number);
      L.marker([lat, lng]).addTo(map)
        .bindPopup("📍 " + nombre).openPopup();
    }
  </script>
</body>
</html>
